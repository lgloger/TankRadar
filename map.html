<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tankpreise & mehr: Tankstellen vergleichen – TankRadar Map</title>
    <meta
      name="description"
      content="TankRadar zeigt aktuelle Kraftstoffpreise als Liste und interaktive Karte – kostenlos, werbefrei und ohne Datenspeicherung."
    />

    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://tankradar.pages.dev/" />

    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="TankRadar – Aktuelle Tankpreise in deiner Nähe"
    />
    <meta
      property="og:description"
      content="Kostenlose Übersicht aktueller Kraftstoffpreise als Liste und Karte, ohne Cookies oder Tracking."
    />
    <meta property="og:url" content="https://tankradar.pages.dev/" />
    <meta
      property="og:image"
      content="https://tankradar.pages.dev/assets/productImages/metaOgImage.png"
    />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:site_name" content="TankRadar" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="TankRadar – Aktuelle Tankpreise in deiner Nähe"
    />
    <meta
      name="twitter:description"
      content="Aktuelle Spritpreise als Liste und Karte – kostenlos & ohne Tracking."
    />
    <meta
      name="twitter:image"
      content="https://tankradar.pages.dev/assets/productImages/metaOgImage.png"
    />

    <meta name="theme-color" content="#1a73e8" />

    <link rel="shortcut icon" href="assets/favicon.jpg" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <link rel="stylesheet" href="styles/header.css" />
    <link rel="stylesheet" href="styles/map.css" />
    <link rel="manifest" href="manifest.json" />

    <script type="module" src="scripts/map.js" defer></script>
    <script src="scripts/utils.js" defer></script>
  </head>
  <body>
    <header>
      <div class="headerFirstCon">
        <a class="buttonCon blurEffect" href="index.html">
          <img
            src="assets/icons/water.svg"
            alt="TankRadar"
            class="buttonConIcon"
          />
        </a>
        <div class="buttonListCon blurEffect">
          <a class="buttonCon" href="tankstellen.html" title="Karte">
            <img
              src="assets/icons/list.svg"
              alt="Liste"
              class="buttonConIcon"
            />
          </a>
          <button
            class="buttonCon"
            title="Preisinformationen"
            aria-label="Preisinformationen"
            id="infoBtn"
          >
            <img
              src="assets/icons/info.svg"
              alt="Impressum"
              class="buttonConIcon"
            />
          </button>
        </div>
      </div>
    </header>
    <main>
      <img
        src="assets/loadingGifs/accordion-loader.gif"
        alt="loading"
        class="loadingAnimation"
      />
    </main>
    <div class="infoContainer hideInfoContainer">
      <div class="infoContentCon blurEffect">
        <div class="infoContentConHeader">
          <span class="infoContentConHeaderText">Preise & Datenquelle</span>
          <button class="infoContentConHeaderBtn" id="infoCloseBtn">
            <img
              class="infoContentConHeaderIcon"
              src="assets/icons/close.svg"
              alt="close"
            />
          </button>
        </div>
        <span class="infoContentConText"
          >Alle Preise ohne Gewähr – Datenquelle: Tankerkönig / MTS-K
          (Bundeskartellamt). Für die Richtigkeit und Aktualität der Preise
          übernehme ich keine Verantwortung, maßgeblich sind stets die vor Ort
          ausgeschilderten Preise.</span
        >
        <span class="infoContentConText"
          >Vollständiger Haftungsausschluss im
          <a href="impressum.html" class="infoContentConTextLink"
            >Impressum</a
          ></span
        >
      </div>
    </div>
    <div id="map"></div>
    <div class="firstOverlay"></div>
  </body>
</html>
